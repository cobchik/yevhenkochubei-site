<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <!-- Google Analytics 4 — той самий потік, що й на старому сайті;
       через нього ж підтверджено Search Console, тому не прибирати -->
  {% unless site.launched %}<meta name="robots" content="noindex, nofollow">{% endunless %}
  {% if site.launched %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');

    // Надсилання форми Tally → подія в GA4.
    // generate_lead — ЛИШЕ запис на консультацію: це ключова подія, на якій вчиться реклама.
    // Група і компанії — окремі події, щоб не змішувати їх із клієнтами на консультацію.
    var tallyForms = {
      xXK5j9: { event: 'generate_lead',        type: 'consultation' },
      aQVq2W: { event: 'group_waitlist_signup', type: 'group_waitlist' },
      obXMW5: { event: 'b2b_lead',             type: 'b2b' }
    };
    window.addEventListener('message', function (e) {
      if (typeof e.data !== 'string' || e.data.indexOf('Tally.FormSubmitted') === -1) return;
      try {
        var p = JSON.parse(e.data).payload || {};
        var f = tallyForms[p.formId];
        if (f) {
          gtag('event', f.event, { form_type: f.type });
        } else {
          gtag('event', 'test_completed', { form_id: p.formId });
        }
      } catch (err) {}
    });
  </script>
  {% endif %}
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://tally.so">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
  {% include schema.html %}
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  {% include lightbox.html %}
  <script>
    // Зовнішні посилання (соцмережі, подкаст, джерела) — у новій вкладці;
    // внутрішні, пошта й телефони — як звичайно
    document.querySelectorAll('a[href^="http"]').forEach(function (a) {
      if (a.hostname !== location.hostname) {
        a.target = '_blank';
        a.rel = 'noopener';
      }
    });
  </script>
</body>
</html>
