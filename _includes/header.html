<div class="site-header-band">
<header class="site-header">
  <a class="logo" href="{{ '/' | relative_url }}">
    <span class="logo-name">Євген Кочубей</span>
    <span class="logo-tagline">психотерапія, групи, робота з командами</span>
  </a>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Меню">
    <span></span><span></span><span></span>
  </button>
  <nav id="site-nav">
    <a href="{{ '/choloviky/' | relative_url }}">Для чоловіків</a>
    <a href="{{ '/zagalni-stany/' | relative_url }}">Тривога і стосунки</a>
    <a href="{{ '/samodopomoga/' | relative_url }}">Самодопомога</a>
    <a href="{{ '/blog/' | relative_url }}">Блог</a>
    <a href="{{ '/hrupy/' | relative_url }}">Групи</a>
    <a href="{{ '/pro-mene/' | relative_url }}">Про мене</a>
    <a href="{{ '/kontakty/' | relative_url }}">Контакти</a>
  </nav>
</header>
</div>
<script>
  (function () {
    var btn = document.querySelector('.nav-toggle');
    var header = document.querySelector('.site-header');
    btn.addEventListener('click', function () {
      var open = header.classList.toggle('nav-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  })();
</script>
